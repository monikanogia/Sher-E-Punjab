<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#1a3a26" />
    <title>Sher-E-Punjab - Digital Menu</title>
    <meta name="description" content="Pure Vegetarian Restaurant - Breakfast, Lunch, Dinner. Order online via WhatsApp." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Aggressive Cache Busting -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Redirect old deployment URLs to production domain -->
    <script>
      (function() {
        const PRODUCTION_DOMAIN = 'sher-e-punjab-menu-app.vercel.app';
        const currentHost = window.location.hostname;
        
        // Check if current URL is NOT the production domain
        if (currentHost !== PRODUCTION_DOMAIN && currentHost.includes('vercel.app')) {
          // Redirect to production domain with same path and query params
          const newUrl = 'https://' + PRODUCTION_DOMAIN + window.location.pathname + window.location.search + window.location.hash;
          console.log('🔄 Redirecting from old deployment to production:', newUrl);
          window.location.replace(newUrl);
        }
      })();
    </script>
    
    <!-- DNS Prefetch & Preconnect for faster resource loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://sher-e-punjab-1aqj.onrender.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://sher-e-punjab-1aqj.onrender.com" />
    
    <!-- Fonts with display=swap for faster rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
