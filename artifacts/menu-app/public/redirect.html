<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0;url=https://sher-e-punjab-menu-app.vercel.app/">
  <title>Redirecting...</title>
  <script>
    // Immediate redirect
    window.location.replace('https://sher-e-punjab-menu-app.vercel.app' + window.location.pathname + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1a3a26 0%, #2d5a3d 100%);
      color: white;
    }
    .container {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>Redirecting to latest menu...</h2>
    <p>If not redirected, <a href="https://sher-e-punjab-menu-app.vercel.app/" style="color: #ffd700;">click here</a></p>
  </div>
</body>
</html>
